<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동덕여자대학교 강의자료실 (데모)</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --dd-primary: #00543c;
      --dd-primary-dark: #003b29;
      --dd-primary-soft: #e8f1ed;
      --dd-accent: #b48a2f;
      --dd-ink: #1a1a1a;
      --dd-ink-soft: #4a4a4a;
      --dd-muted: #8a8a8a;
      --dd-line: #e2e2e2;
      --dd-line-strong: #cccccc;
      --dd-bg: #ffffff;
      --dd-bg-alt: #f6f6f4;
      --dd-danger: #b3261e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--dd-bg); }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      color: var(--dd-ink); font-size: 15px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--dd-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 14px; }

    .site-header { border-bottom: 2px solid var(--dd-primary); background: #fff; }
    .site-header-inner {
      max-width: 1200px; margin: 0 auto; padding: 18px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .site-brand { display: flex; align-items: center; gap: 14px; color: var(--dd-ink); cursor: pointer; }
    .site-brand-mark {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--dd-primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; letter-spacing: -0.5px;
    }
    .site-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .site-brand-title { font-size: 17px; font-weight: 700; color: var(--dd-ink); }
    .site-brand-sub { font-size: 12px; color: var(--dd-muted); letter-spacing: 0.02em; }

    .site-nav { display: flex; gap: 6px; align-items: center; }
    .site-nav .navlink {
      padding: 8px 14px; color: var(--dd-ink-soft);
      font-size: 14px; font-weight: 500; background: transparent; border: none;
    }
    .site-nav .navlink.active { color: var(--dd-primary); font-weight: 700; }
    .site-nav .btn-outline {
      border: 1px solid var(--dd-line-strong); padding: 6px 14px;
      border-radius: 2px; color: var(--dd-ink); background: #fff;
    }
    .site-nav .btn-outline:hover { border-color: var(--dd-primary); color: var(--dd-primary); }

    .page-title-band { background: var(--dd-primary); color: #fff; padding: 44px 0; }
    .page-title-band-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .page-title-band h1 { margin: 0 0 6px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .page-title-band p { margin: 0; font-size: 14px; opacity: 0.85; }
    .page-title-band .breadcrumb { color: #fff; text-decoration: underline; font-size: 13px; }

    .page { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }

    .site-footer {
      border-top: 1px solid var(--dd-line); background: var(--dd-bg-alt);
      color: var(--dd-muted); font-size: 12px; padding: 22px 24px;
      text-align: center; margin-top: 40px;
    }

    .btn {
      display: inline-block; padding: 10px 20px; border-radius: 2px;
      font-size: 14px; font-weight: 600; border: 1px solid transparent;
    }
    .btn-primary { background: var(--dd-primary); color: #fff; border-color: var(--dd-primary); }
    .btn-primary:hover { background: var(--dd-primary-dark); border-color: var(--dd-primary-dark); }
    .btn-outline { background: #fff; color: var(--dd-ink); border-color: var(--dd-line-strong); }
    .btn-outline:hover { border-color: var(--dd-primary); color: var(--dd-primary); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--dd-ink); }
    .field label .req { color: var(--dd-danger); margin-left: 3px; }
    .field input[type="text"], .field input[type="date"], .field input[type="password"],
    .field input[type="url"], .field select {
      padding: 10px 12px; border: 1px solid var(--dd-line-strong);
      border-radius: 2px; background: #fff; color: var(--dd-ink); outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--dd-primary); }
    .field .hint { font-size: 12px; color: var(--dd-muted); }

    .tag {
      display: inline-block; padding: 3px 10px; border-radius: 2px;
      background: var(--dd-primary-soft); color: var(--dd-primary);
      font-size: 12px; font-weight: 700;
    }
    .tag-neutral { background: #f0f0ee; color: var(--dd-ink-soft); }

    .error-banner {
      padding: 12px 14px; border-left: 3px solid var(--dd-danger);
      background: #fdecea; color: var(--dd-danger);
      font-size: 13px; margin-bottom: 16px;
    }
    .ok-banner {
      padding: 12px 14px; border-left: 3px solid var(--dd-primary);
      background: var(--dd-primary-soft); color: var(--dd-primary-dark);
      font-size: 13px; margin-bottom: 16px;
    }
    .info-banner {
      padding: 12px 14px; border-left: 3px solid var(--dd-accent);
      background: #fbf5e6; color: #7a5a10;
      font-size: 12px; margin-bottom: 20px;
    }

    .section-tabs {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--dd-line);
      margin-bottom: 20px;
    }
    .section-tab {
      padding: 12px 22px; background: transparent; border: none;
      border-bottom: 3px solid transparent;
      color: var(--dd-ink-soft); font-size: 15px; font-weight: 600;
      margin-bottom: -1px;
    }
    .section-tab.active { color: var(--dd-primary); border-bottom-color: var(--dd-primary); }

    .filter-bar {
      display: flex; gap: 12px; align-items: flex-end;
      padding: 16px; background: var(--dd-bg-alt);
      border: 1px solid var(--dd-line); border-radius: 2px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
    .filter-field label {
      font-size: 11px; font-weight: 700; color: var(--dd-ink-soft);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .filter-field input {
      padding: 8px 10px; border: 1px solid var(--dd-line-strong);
      border-radius: 2px; background: #fff; outline: none; font-size: 13px;
    }
    .filter-field input:focus { border-color: var(--dd-primary); }

    .lecture-table { width: 100%; border-collapse: collapse; border-top: 2px solid var(--dd-ink); }
    .lecture-table th, .lecture-table td {
      padding: 14px 12px; text-align: left;
      border-bottom: 1px solid var(--dd-line);
      font-size: 14px; vertical-align: middle;
    }
    .lecture-table th { background: var(--dd-bg-alt); color: var(--dd-ink); font-weight: 700; font-size: 13px; }
    .lecture-table td.col-date { color: var(--dd-ink-soft); width: 130px; font-variant-numeric: tabular-nums; }
    .lecture-table td.col-section { width: 110px; }
    .lecture-table td.col-title { font-weight: 600; color: var(--dd-ink); }
    .lecture-table .title-btn {
      background: none; border: none; padding: 0; color: var(--dd-ink);
      font-weight: 600; text-align: left; cursor: pointer;
    }
    .lecture-table .title-btn:hover { color: var(--dd-primary); text-decoration: underline; }
    .lecture-table td.col-open { width: 120px; text-align: right; }
    .lecture-table .empty-row td { text-align: center; color: var(--dd-muted); padding: 60px 12px; }

    .admin-grid { display: grid; grid-template-columns: 400px 1fr; gap: 32px; align-items: start; }
    @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid var(--dd-line); padding: 24px; border-radius: 2px; }
    .card-title {
      font-size: 16px; font-weight: 700; color: var(--dd-ink);
      border-bottom: 2px solid var(--dd-primary); padding-bottom: 10px; margin: 0 0 20px;
    }
    .form-row { display: flex; gap: 8px; }
    .form-row > .field { flex: 1; }

    .materials-block {
      margin-top: 8px; padding: 16px; background: var(--dd-bg-alt);
      border: 1px solid var(--dd-line); border-radius: 2px;
    }
    .materials-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--dd-ink);
    }
    .materials-header .req { color: var(--dd-danger); margin-left: 3px; }
    .material-row {
      background: #fff; border: 1px solid var(--dd-line); border-radius: 2px;
      padding: 12px; margin-bottom: 10px;
    }
    .material-row-head { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .material-row-head select {
      width: 80px; padding: 6px 8px;
      border: 1px solid var(--dd-line-strong); border-radius: 2px; background: #fff; font-size: 13px;
    }
    .material-row-head > input[type="text"] {
      flex: 1; padding: 6px 10px;
      border: 1px solid var(--dd-line-strong); border-radius: 2px; background: #fff; font-size: 13px;
    }
    .material-row input[type="url"], .material-row input[type="file"] {
      width: 100%; padding: 6px 10px;
      border: 1px solid var(--dd-line-strong); border-radius: 2px; background: #fff; font-size: 13px;
    }
    .material-row .filename {
      color: var(--dd-primary); font-weight: 600; font-size: 12px;
      margin-top: 6px; word-break: break-all;
    }
    .material-row .existing-file {
      font-size: 12px; color: var(--dd-ink-soft); padding: 6px 10px;
      background: var(--dd-primary-soft); border-radius: 2px; margin-bottom: 6px;
    }
    .btn-icon-remove {
      background: transparent; border: 1px solid var(--dd-line-strong);
      color: var(--dd-muted); width: 28px; height: 28px;
      border-radius: 2px; font-size: 16px; line-height: 1;
    }
    .btn-icon-remove:hover { border-color: var(--dd-danger); color: var(--dd-danger); }

    .admin-table { width: 100%; border-collapse: collapse; border-top: 2px solid var(--dd-ink); }
    .admin-table th, .admin-table td {
      padding: 12px 10px; border-bottom: 1px solid var(--dd-line);
      font-size: 13px; vertical-align: middle;
    }
    .admin-table th { background: var(--dd-bg-alt); font-weight: 700; font-size: 12px; text-align: left; }
    .admin-table .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .admin-table .row-actions button {
      padding: 4px 10px; font-size: 12px; border-radius: 2px;
      border: 1px solid var(--dd-line-strong); background: #fff; color: var(--dd-ink-soft);
    }
    .admin-table .row-actions button:hover { color: var(--dd-primary); border-color: var(--dd-primary); }
    .admin-table .row-actions button.danger:hover { color: var(--dd-danger); border-color: var(--dd-danger); }

    .login-wrap {
      max-width: 380px; margin: 80px auto; padding: 40px 32px;
      border: 1px solid var(--dd-line); background: #fff;
    }
    .login-wrap h1 { text-align: center; font-size: 20px; margin: 0 0 6px; color: var(--dd-primary); }
    .login-wrap .subtitle { text-align: center; color: var(--dd-muted); font-size: 13px; margin-bottom: 28px; }
    .login-wrap .btn-primary { width: 100%; padding: 12px; margin-top: 8px; }

    .detail-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .detail-layout { grid-template-columns: 1fr; } }
    .material-list { background: #fff; border: 1px solid var(--dd-line); padding: 16px; border-radius: 2px; }
    .material-list .card-title { font-size: 14px; margin-top: 0; margin-bottom: 12px; }
    .material-item {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 10px; background: #fff;
      border: 1px solid var(--dd-line); border-radius: 2px;
      cursor: pointer; text-align: left; margin-bottom: 6px;
      font-size: 13px; color: var(--dd-ink);
    }
    .material-item:hover { border-color: var(--dd-primary); background: var(--dd-primary-soft); }
    .material-item.active { border-color: var(--dd-primary); background: var(--dd-primary-soft); font-weight: 700; }
    .material-item .material-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .material-viewer { border: 1px solid var(--dd-line); background: #fff; border-radius: 2px; overflow: hidden; }
    .material-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--dd-bg-alt); border-bottom: 1px solid var(--dd-line);
    }
    .material-title { font-weight: 700; font-size: 14px; color: var(--dd-ink); }
    .material-iframe {
      display: block; width: 100%; height: 70vh; min-height: 500px; border: 0; background: #fff;
    }

    .admin-side { display: flex; flex-direction: column; gap: 20px; }
    .qr-card { text-align: center; }
    .qr-card .qr-desc { font-size: 12px; color: var(--dd-muted); margin: 0 0 12px; line-height: 1.5; }
    .qr-image { display: flex; justify-content: center; margin: 0 0 12px; }
    .qr-image svg, .qr-image img { width: 200px; height: 200px; border: 1px solid var(--dd-line); }
    .qr-url {
      font-family: 'Consolas', monospace; font-size: 12px;
      color: var(--dd-ink-soft); background: var(--dd-bg-alt);
      padding: 6px 10px; border-radius: 2px; margin-bottom: 10px; word-break: break-all;
    }

    @media (max-width: 640px) {
      .site-header-inner { padding: 12px 16px; flex-wrap: wrap; gap: 12px; }
      .site-brand-title { font-size: 15px; }
      .site-brand-sub { display: none; }
      .site-brand-mark { width: 34px; height: 34px; font-size: 14px; }
      .page { padding: 24px 16px 60px; }
      .page-title-band { padding: 28px 0; }
      .page-title-band h1 { font-size: 22px; }
      .section-tab { padding: 10px 14px; font-size: 13px; }
      .filter-bar { padding: 12px; gap: 8px; }
      .filter-field { min-width: 100%; }
      .lecture-table, .admin-table { display: block; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
      .lecture-table thead, .admin-table thead { display: table-header-group; }
      .lecture-table tbody, .admin-table tbody { display: table-row-group; }
      .lecture-table tr, .admin-table tr { display: table-row; }
      .lecture-table td.col-title, .lecture-table th.col-title { white-space: normal; min-width: 180px; }
      .card { padding: 18px; }
      .card-title { font-size: 15px; }
      .detail-layout { grid-template-columns: 1fr; }
      .material-iframe { height: 60vh; min-height: 380px; }
      .qr-image svg, .qr-image img { width: 160px; height: 160px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand" data-action="go-student">
        <div class="site-brand-mark">동덕</div>
        <div class="site-brand-text">
          <span class="site-brand-title">동덕여자대학교 강의자료실</span>
          <span class="site-brand-sub">DONGDUK WOMEN'S UNIVERSITY · LECTURE PORTAL (DEMO)</span>
        </div>
      </div>
      <nav class="site-nav" id="nav"></nav>
    </div>
  </header>

  <main id="root"></main>

  <footer class="site-footer">
    © 동덕여자대학교 AI콘텐츠제작 · 강의자료 공유 포털 (스탠드얼론 데모 · 데이터는 이 브라우저에만 저장됩니다)
  </footer>

  <script>
    // ============ Config ============
    const LS_LECTURES = 'lp_standalone_lectures_v2';
    const LS_LECTURES_LEGACY = 'lp_standalone_lectures_v1';
    const LS_AUTH = 'lp_standalone_auth_v1';
    const ADMIN_ID = 'snownoon';
    const ADMIN_PW = 'snownoon';
    const MAX_FILE_BYTES = 4 * 1024 * 1024;
    const MAX_MATERIALS = 10;

    // ============ State ============
    const state = {
      view: 'student',            // 'student' | 'login' | 'admin' | 'detail'
      section: '전체',
      q: '',
      from: '',
      to: '',
      detailId: null,
      detailActiveIdx: 0,
      form: emptyForm(),
      editingId: null,
      banner: null,
      loginError: null,
    };

    function emptyMaterial(kind = 'url') {
      return { kind, label: '', value: '', fileContent: null, fileName: null, keep: false };
    }
    function emptyForm() {
      return { section: '전체', date: '', title: '', materials: [emptyMaterial('url')] };
    }
    const SECTION_OPTIONS_ADMIN = ['1분반', '2분반', '전체'];

    // ============ Storage + migration ============
    function migrateLegacy() {
      if (localStorage.getItem(LS_LECTURES)) return;
      const legacy = localStorage.getItem(LS_LECTURES_LEGACY);
      if (!legacy) return;
      try {
        const arr = JSON.parse(legacy);
        const migrated = arr.map((row) => {
          let materials = [];
          if (row.materialType === 'file' && row.fileContent) {
            materials.push({
              kind: 'file', label: row.originalFilename || '강의 자료',
              value: row.fileContent, originalFilename: row.originalFilename || null,
            });
          } else if (row.materialType === 'url' && row.materialValue) {
            materials.push({ kind: 'url', label: '강의 링크', value: row.materialValue });
          }
          return {
            id: row.id, section: row.section, date: row.date, title: row.title,
            materials, createdAt: row.createdAt || new Date().toISOString(),
          };
        });
        localStorage.setItem(LS_LECTURES, JSON.stringify(migrated));
      } catch { /* ignore malformed */ }
    }
    function loadLectures() {
      try { return JSON.parse(localStorage.getItem(LS_LECTURES) || '[]'); }
      catch { return []; }
    }
    function saveLectures(list) {
      localStorage.setItem(LS_LECTURES, JSON.stringify(list));
    }
    function isLoggedIn() { return localStorage.getItem(LS_AUTH) === '1'; }
    function setLoggedIn(v) { v ? localStorage.setItem(LS_AUTH, '1') : localStorage.removeItem(LS_AUTH); }

    // ============ Helpers ============
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }
    function formatDateLong(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }
    function sortLectures(list) {
      return [...list].sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : b.id - a.id));
    }
    function applyFilters(list) {
      let out = list;
      if (state.section !== '전체') out = out.filter((l) => l.section === state.section);
      const q = state.q.trim().toLowerCase();
      if (q) out = out.filter((l) => (l.title || '').toLowerCase().includes(q));
      if (state.from) out = out.filter((l) => l.date >= state.from);
      if (state.to) out = out.filter((l) => l.date <= state.to);
      return out;
    }

    // ============ Actions ============
    function attemptLogin(id, pw) {
      if (id === ADMIN_ID && pw === ADMIN_PW) {
        setLoggedIn(true); state.view = 'admin';
        state.loginError = null; state.banner = null;
      } else {
        state.loginError = '아이디 또는 비밀번호가 올바르지 않습니다.';
      }
      render();
    }
    function doLogout() {
      setLoggedIn(false); state.view = 'student';
      state.form = emptyForm(); state.editingId = null;
      state.banner = null; render();
    }

    function setMaterial(idx, patch) {
      state.form.materials[idx] = { ...state.form.materials[idx], ...patch };
    }
    function addMaterial() {
      if (state.form.materials.length >= MAX_MATERIALS) return;
      state.form.materials.push(emptyMaterial('url'));
      render();
    }
    function removeMaterial(idx) {
      state.form.materials.splice(idx, 1);
      if (state.form.materials.length === 0) state.form.materials.push(emptyMaterial('url'));
      render();
    }

    function saveForm() {
      const { form, editingId } = state;
      if (!form.section || !form.date || !form.title.trim()) {
        state.banner = { type: 'error', message: '분반, 날짜, 타이틀은 필수입니다.' };
        return render();
      }
      if (form.materials.length === 0) {
        state.banner = { type: 'error', message: '최소 하나의 자료를 추가하세요.' };
        return render();
      }
      for (let i = 0; i < form.materials.length; i++) {
        const m = form.materials[i];
        if (!m.label.trim()) {
          state.banner = { type: 'error', message: `${i + 1}번째 자료의 라벨을 입력하세요.` };
          return render();
        }
        if (m.kind === 'url' && !m.value.trim()) {
          state.banner = { type: 'error', message: `${i + 1}번째 자료의 URL을 입력하세요.` };
          return render();
        }
        if (m.kind === 'file' && !m.fileContent && !(m.keep && m.value)) {
          state.banner = { type: 'error', message: `${i + 1}번째 자료의 파일을 선택하세요.` };
          return render();
        }
      }

      const list = loadLectures();
      const existing = editingId ? list.find((l) => l.id === editingId) : null;
      const finalMaterials = form.materials.map((m) => {
        if (m.kind === 'url') return { kind: 'url', label: m.label.trim(), value: m.value.trim() };
        if (m.kind === 'file') {
          if (m.keep && m.value && !m.fileContent) {
            return { kind: 'file', label: m.label.trim(), value: m.value, originalFilename: m.originalFilename || null };
          }
          return {
            kind: 'file', label: m.label.trim(),
            value: m.fileContent, originalFilename: m.fileName,
          };
        }
        return null;
      });

      // '전체' on create → insert one record per section. Edit path only accepts individual sections.
      const sectionsToCreate = existing
        ? [form.section === '전체' ? existing.section : form.section]
        : (form.section === '전체' ? ['1분반', '2분반'] : [form.section]);

      let records;
      if (existing) {
        const sec = sectionsToCreate[0];
        records = [{ ...existing, section: sec, date: form.date, title: form.title.trim(), materials: finalMaterials }];
      } else {
        const baseId = Date.now();
        records = sectionsToCreate.map((sec, i) => ({
          id: baseId + i,
          section: sec, date: form.date, title: form.title.trim(),
          materials: finalMaterials,
          createdAt: new Date().toISOString(),
        }));
      }

      const next = existing
        ? list.map((l) => (l.id === editingId ? records[0] : l))
        : [...list, ...records];
      try {
        saveLectures(next);
        const message = existing
          ? '강의를 수정했습니다.'
          : (records.length > 1 ? `강의를 ${records.length}개 분반에 동시에 등록했습니다.` : '강의를 등록했습니다.');
        state.banner = { type: 'ok', message };
        state.form = emptyForm(); state.editingId = null;
      } catch {
        state.banner = {
          type: 'error',
          message: '저장 실패: 브라우저 저장 용량 초과. 큰 파일은 URL로 등록하세요.'
        };
      }
      render();
    }

    function startEdit(id) {
      const item = loadLectures().find((l) => l.id === id);
      if (!item) return;
      state.editingId = id;
      state.form = {
        section: item.section, date: item.date, title: item.title,
        materials: (item.materials || []).map((m) => (
          m.kind === 'url'
            ? { kind: 'url', label: m.label, value: m.value, fileContent: null, fileName: null, keep: false }
            : { kind: 'file', label: m.label, value: m.value, originalFilename: m.originalFilename,
                fileContent: null, fileName: null, keep: true }
        )),
      };
      if (state.form.materials.length === 0) state.form.materials.push(emptyMaterial('url'));
      state.banner = null; state.view = 'admin';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      state.editingId = null; state.form = emptyForm();
      state.banner = null; render();
    }

    function deleteItem(id) {
      const item = loadLectures().find((l) => l.id === id);
      if (!item) return;
      if (!confirm(`"${item.title}" 강의를 삭제하시겠습니까?`)) return;
      const next = loadLectures().filter((l) => l.id !== id);
      saveLectures(next);
      if (state.editingId === id) { state.editingId = null; state.form = emptyForm(); }
      state.banner = { type: 'ok', message: '강의를 삭제했습니다.' };
      render();
    }

    function goDetail(id) {
      state.view = 'detail'; state.detailId = id; state.detailActiveIdx = 0;
      state.banner = null; render();
    }

    function materialBlobUrl(m) {
      if (!m || m.kind !== 'file' || !m.value) return null;
      const blob = new Blob([m.value], { type: 'text/html;charset=utf-8' });
      return URL.createObjectURL(blob);
    }

    // ============ Rendering ============
    function renderNav() {
      const loggedIn = isLoggedIn();
      const activeStudent = state.view === 'student' || state.view === 'detail';
      return `
        <button class="navlink ${activeStudent ? 'active' : ''}" data-action="go-student">강의자료</button>
        ${loggedIn ? `
          <button class="navlink ${state.view === 'admin' ? 'active' : ''}" data-action="go-admin">관리자</button>
          <button class="btn-outline" data-action="logout">로그아웃</button>
        ` : `
          <button class="btn-outline" data-action="go-login">교수 로그인</button>
        `}
      `;
    }

    function renderBanner() {
      if (!state.banner) return '';
      const cls = state.banner.type === 'ok' ? 'ok-banner'
                 : state.banner.type === 'info' ? 'info-banner' : 'error-banner';
      return `<div class="${cls}">${esc(state.banner.message)}</div>`;
    }

    function renderStudent() {

      const sections = ['전체', '1분반', '2분반'];
      const rows = list.length === 0
        ? `<tr class="empty-row"><td colspan="5">조건에 맞는 강의가 없습니다.</td></tr>`
        : list.map((row) => `
            <tr>
              <td class="col-date">${formatDate(row.date)}</td>

                <button class="title-btn" data-action="detail" data-id="${row.id}">${esc(row.title)}</button>
              </td>
              <td><span class="tag tag-neutral">${(row.materials || []).length}개</span></td>
              <td class="col-open">
                <button class="btn btn-outline" style="padding:6px 14px;font-size:13px"

      return `
        <div class="page-title-band">
          <div class="page-title-band-inner">
            <h1>강의자료</h1>

          </div>
        </div>
        <div class="page">
          <div class="section-tabs">
            ${sections.map((s) => `
              <button class="section-tab ${s === state.section ? 'active' : ''}"
                      data-action="set-section" data-section="${esc(s)}">${esc(s)}</button>
            `).join('')}
          </div>
          <div class="filter-bar">
            <div class="filter-field">
              <label>검색</label>
              <input type="text" id="f-q" value="${esc(state.q)}" placeholder="타이틀 검색..." />
            </div>
            <div class="filter-field">
              <label>시작일</label>
              <input type="date" id="f-from" value="${esc(state.from)}" />
            </div>

              <input type="date" id="f-to" value="${esc(state.to)}" />

            ${(state.q || state.from || state.to)

    function renderDetail() {
      const lecture = loadLectures().find((l) => l.id === state.detailId);
      if (!lecture) {
        state.view = 'student';
        return renderStudent();
      }
      const materials = lecture.materials || [];
      const active = materials[state.detailActiveIdx];

      let viewerHtml = '<div class="info-banner">등록된 자료가 없습니다.</div>';
      if (active) {
        let src = '', openHref = '';
        if (active.kind === 'url') { src = active.value; openHref = active.value; }
        else if (active.kind === 'file') {

          src = url; openHref = url;

        viewerHtml = `
          <div class="material-viewer">
            <div class="material-toolbar">
              <span class="material-title">${esc(active.label)}</span>

            </div>

        let bodyHtml = '';
        if (m.kind === 'url') {

                             value="${esc(m.value)}" placeholder="https://..." />`;
        } else {
          const existing = m.keep && m.value && !m.fileContent
            ? `<div class="existing-file">현재: ${esc(m.originalFilename || '파일')} <span class="hint" style="margin-left:8px">새 파일 선택 시 교체됩니다</span></div>`
            : '';
          const chosen = m.fileName ? `<div class="filename">선택됨: ${esc(m.fileName)}</div>` : '';
          bodyHtml = `${existing}
            <input type="file" data-mat-idx="${idx}" data-mat-field="file" accept=".html,.htm,text/html" />

        }
        return `
          <div class="material-row">
            <div class="material-row-head">
              <select data-mat-idx="${idx}" data-mat-field="kind">
                <option value="url" ${m.kind === 'url' ? 'selected' : ''}>URL</option>
                <option value="file" ${m.kind === 'file' ? 'selected' : ''}>파일</option>
              </select>
              <input type="text" data-mat-idx="${idx}" data-mat-field="label"
                     value="${esc(m.label)}" placeholder="라벨 (예: 슬라이드)" />
              ${removable
                ? `<button type="button" class="btn-icon-remove" data-action="remove-material" data-idx="${idx}" title="삭제">×</button>`
                : ''}
            </div>
            ${bodyHtml}
          </div>
        `;
      }).join('');

      const rowsHtml = list.length === 0
        ? `<tr><td colspan="5" style="text-align:center;color:var(--dd-muted);padding:40px 12px">등록된 강의가 없습니다.</td></tr>`
        : list.map((row) => `
            <tr>
              <td>${formatDate(row.date)}</td>
              <td><span class="tag">${esc(row.section)}</span></td>
              <td>${esc(row.title)}</td>
              <td><span class="tag tag-neutral">${(row.materials || []).length}</span></td>
              <td>
                <div class="row-actions">
                  <button data-action="edit" data-id="${row.id}">수정</button>

                </div>

            </tr>
          `).join('');

      return `
        <div class="page-title-band">
          <div class="page-title-band-inner">
            <h1>관리자 페이지</h1>
            <p>강의 자료를 등록하고 관리합니다. (교수 전용)</p>
          </div>
        </div>
        <div class="page">
          <div class="info-banner">
            💡 데모 모드: 등록한 강의와 업로드한 파일은 <b>이 브라우저(localStorage)</b>에만 저장됩니다.
            파일 업로드는 최대 4MB까지 지원합니다.
          </div>
          <div class="admin-grid">
            <div class="admin-side">
            <section class="card">
              <h2 class="card-title">${editingId ? '강의 수정' : '강의 등록'}</h2>
              ${renderBanner()}
              <form id="lecture-form">
                <div class="form-row">
                  <div class="field">
                    <label>분반<span class="req">*</span></label>
                    <select id="f-section" required ${editingId ? 'disabled' : ''}>
                      ${SECTION_OPTIONS_ADMIN.map((s) => `<option value="${esc(s)}" ${form.section === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
                    </select>
                    ${!editingId && form.section === '전체'
                      ? `<span class="hint">'전체' 선택 시 1분반·2분반에 동시에 등록됩니다.</span>` : ''}
                    ${editingId ? `<span class="hint">수정 시 분반은 변경할 수 없습니다.</span>` : ''}
                  </div>
                  <div class="field">
                    <label>날짜<span class="req">*</span></label>
                    <input type="date" id="f-date" value="${esc(form.date)}" required />
                  </div>
                </div>
                <div class="field">
                  <label>강의 타이틀<span class="req">*</span></label>
                  <input type="text" id="f-title" value="${esc(form.title)}"
                         placeholder="예) 3주차 - 프롬프트 엔지니어링 기초" required />
                </div>

                <div class="materials-block">
                  <div class="materials-header">
                    <span>강의 자료<span class="req">*</span></span>
                    <button type="button" class="btn btn-outline"
                            style="padding:4px 12px;font-size:12px"
                            data-action="add-material"
                            ${form.materials.length >= MAX_MATERIALS ? 'disabled' : ''}>
                      + 자료 추가 (${form.materials.length}/${MAX_MATERIALS})
                    </button>
                  </div>
                  ${materialsHtml}
                </div>

                <div style="display:flex;gap:8px;margin-top:20px">
                  <button class="btn btn-primary" type="submit">
                    ${editingId ? '수정 저장' : '강의 등록'}
                  </button>
                  ${editingId ? `<button class="btn btn-outline" type="button" data-action="cancel-edit">취소</button>` : ''}
                </div>
              </form>
            </section>

            <section class="card qr-card">
              <h2 class="card-title">학생 접속 QR</h2>
              <p class="qr-desc">수업 화면에 QR을 띄워두면 학생들이 스캔해서 강의자료 페이지로 접속할 수 있습니다.</p>
              <div class="qr-image" id="qr-target"></div>
              <div class="qr-url" id="qr-url"></div>
              <button class="btn btn-outline" data-action="copy-url" id="qr-copy-btn">URL 복사</button>
            </section>
            </div>

            <section class="card">
              <h2 class="card-title">등록된 강의 (${list.length}건)</h2>
              <div class="filter-bar" style="margin-bottom:16px">
                <div class="filter-field">
                  <label>검색</label>
                  <input type="text" id="a-q" value="${esc(state.q)}" placeholder="타이틀..." />
                </div>
                <div class="filter-field">
                  <label>시작일</label>
                  <input type="date" id="a-from" value="${esc(state.from)}" />
                </div>
                <div class="filter-field">
                  <label>종료일</label>
                  <input type="date" id="a-to" value="${esc(state.to)}" />
                </div>
              </div>
              <table class="admin-table">
                <thead>
                  <tr>
                    <th style="width:110px">날짜</th>
                    <th style="width:80px">분반</th>
                    <th>타이틀</th>
                    <th style="width:70px">자료</th>
                    <th style="width:130px"></th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </section>
          </div>
        </div>
      `;
    }

    function render() {
      if (state.view === 'admin' && !isLoggedIn()) state.view = 'login';
      document.getElementById('nav').innerHTML = renderNav();
      const root = document.getElementById('root');
      if (state.view === 'student') root.innerHTML = renderStudent();
      else if (state.view === 'login') root.innerHTML = renderLogin();
      else if (state.view === 'admin') root.innerHTML = renderAdmin();
      else if (state.view === 'detail') root.innerHTML = renderDetail();
      wireForms();
      renderQr();
    }

    function studentUrl() {
      if (typeof window === 'undefined') return '';
      const { origin, pathname } = window.location;
      // Same file serves both views — keep the current path so scanning stays on the same host/file
      return origin + pathname;
    }

    function renderQr() {
      const target = document.getElementById('qr-target');
      const urlEl = document.getElementById('qr-url');
      if (!target || !urlEl) return;
      const url = studentUrl();
      urlEl.textContent = url;
      target.innerHTML = '';
      if (typeof qrcode === 'undefined') {
        target.innerHTML = '<span style="color:var(--dd-muted);font-size:12px">QR 라이브러리 로드 실패 (오프라인?)</span>';
        return;
      }
      try {
        const q = qrcode(0, 'M');
        q.addData(url);
        q.make();
        target.innerHTML = q.createSvgTag({ scalable: true, margin: 2 });
      } catch (e) {
        target.textContent = '(QR 생성 실패: ' + e.message + ')';
      }
    }

    // ============ Wiring ============
    function wireForms() {
      // Login form
      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          attemptLogin(document.getElementById('login-id').value, document.getElementById('login-pw').value);
        });
      }

      // Student filter inputs
      const fq = document.getElementById('f-q');
      const ffrom = document.getElementById('f-from');
      const fto = document.getElementById('f-to');
      if (fq) fq.addEventListener('input', () => { state.q = fq.value; renderStudentOnly(); });
      if (ffrom) ffrom.addEventListener('change', () => { state.from = ffrom.value; renderStudentOnly(); });
      if (fto) fto.addEventListener('change', () => { state.to = fto.value; renderStudentOnly(); });

      // Admin filter inputs
      const aq = document.getElementById('a-q');
      const afrom = document.getElementById('a-from');
      const ato = document.getElementById('a-to');
      if (aq) aq.addEventListener('input', () => { state.q = aq.value; renderAdminTableOnly(); });
      if (afrom) afrom.addEventListener('change', () => { state.from = afrom.value; renderAdminTableOnly(); });
      if (ato) ato.addEventListener('change', () => { state.to = ato.value; renderAdminTableOnly(); });

      // Admin lecture form
      const lectureForm = document.getElementById('lecture-form');
      if (lectureForm) {
        const sel = document.getElementById('f-section');
        const dt = document.getElementById('f-date');
        const tt = document.getElementById('f-title');
        sel.addEventListener('change', () => { state.form.section = sel.value; });
        dt.addEventListener('input', () => { state.form.date = dt.value; });
        tt.addEventListener('input', () => { state.form.title = tt.value; });

        // Material row inputs (delegated on the form)
        lectureForm.addEventListener('input', (e) => {
          const el = e.target;
          const idx = el.dataset?.matIdx;
          const field = el.dataset?.matField;
          if (idx == null || !field) return;
          const i = Number(idx);
          if (field === 'label') setMaterial(i, { label: el.value });
          else if (field === 'value') setMaterial(i, { value: el.value });
        });
        lectureForm.addEventListener('change', (e) => {
          const el = e.target;
          const idx = el.dataset?.matIdx;
          const field = el.dataset?.matField;
          if (idx == null || !field) return;
          const i = Number(idx);
          if (field === 'kind') {
            setMaterial(i, { kind: el.value, value: '', fileContent: null, fileName: null, keep: false });
            render();
          } else if (field === 'file') {
            const file = el.files?.[0];
            if (!file) { setMaterial(i, { fileContent: null, fileName: null }); return; }
            if (file.size > MAX_FILE_BYTES) {
              state.banner = { type: 'error', message: `파일이 너무 큽니다 (최대 4MB): ${(file.size/1024/1024).toFixed(2)}MB` };
              el.value = ''; return render();
            }
            const reader = new FileReader();
            reader.onload = () => {
              setMaterial(i, { fileContent: reader.result, fileName: file.name, keep: false });
              render();
            };
            reader.readAsText(file, 'utf-8');
          }
        });

        lectureForm.addEventListener('submit', (e) => { e.preventDefault(); saveForm(); });
      }
    }

    // Partial re-renders to avoid input focus loss on filters
    function renderStudentOnly() {
      if (state.view !== 'student') return;
      // just re-render the table portion by replacing entire root; then restore focus
      const focusId = document.activeElement?.id;
      const caret = document.activeElement?.selectionStart;
      render();
      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) { el.focus(); if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); }
      }
    }
    function renderAdminTableOnly() {
      if (state.view !== 'admin') return;
      const focusId = document.activeElement?.id;
      const caret = document.activeElement?.selectionStart;
      render();
      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) { el.focus(); if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); }
      }
    }

    // Delegated click handling
    document.body.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id ? Number(target.dataset.id) : null;
      const idx = target.dataset.idx ? Number(target.dataset.idx) : null;

      switch (action) {
        case 'go-student':
          state.view = 'student'; state.banner = null; render(); break;
        case 'go-login':
          state.view = 'login'; state.loginError = null; render(); break;
        case 'go-admin':
          state.view = isLoggedIn() ? 'admin' : 'login';
          state.banner = null; render(); break;
        case 'logout': doLogout(); break;
        case 'set-section':
          state.section = target.dataset.section; render(); break;
        case 'reset-filters':
          state.q = ''; state.from = ''; state.to = ''; render(); break;
        case 'edit': startEdit(id); break;
        case 'delete': deleteItem(id); break;
        case 'detail': goDetail(id); break;
        case 'detail-select': state.detailActiveIdx = idx; render(); break;
        case 'add-material': addMaterial(); break;
        case 'remove-material': removeMaterial(idx); break;
        case 'cancel-edit': cancelEdit(); break;
        case 'copy-url': {
          const url = studentUrl();
          const btn = document.getElementById('qr-copy-btn');
          navigator.clipboard.writeText(url).then(() => {
            if (btn) { btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = 'URL 복사'; }, 1500); }
          }).catch(() => {
            if (btn) btn.textContent = '(복사 실패)';
          });
          break;
        }
      }
    });

    // ============ Init ============
    migrateLegacy();
    render();
  </script>
</body>
</html>
